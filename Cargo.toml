[package]
name = "bitcoin-chain-graph"
version = "0.1.0"
edition = "2021"
authors = ["Michael Down <michael@downuk.com>"]
license = "Apache-2.0"
repository = "https://github.com/mkd-neo4j/bitcoin-chain-graph"
homepage = "https://github.com/mkd-neo4j/bitcoin-chain-graph"
documentation = "https://github.com/mkd-neo4j/bitcoin-chain-graph"
description = "High-performance Bitcoin blockchain ingestion into Neo4j for forensic analysis"
readme = "README.md"
keywords = ["bitcoin", "blockchain", "neo4j", "graph", "forensics"]
categories = ["database", "cryptography::cryptocurrencies"]

[dependencies]
bitcoin = "0.31"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
hex = "0.4"
async-trait = "0.1"
chrono = "0.4"
neo4rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
config = "0.14"
lru = "0.12"
crc32fast = "1.5"
rusty-leveldb = "3.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
memmap2 = "0.9.9"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
zeromq = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
csv = "1.3"

[dev-dependencies]
hex = "0.4"
